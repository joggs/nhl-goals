name: Build data and deploy

on:
  push: { branches: [main] }
  schedule: [{ cron: "*/20 * * * *" }]   # refresh finished games every ~20 min
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Finished games never change, so cache the raw API responses between runs.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: nhl-cache-${{ github.run_id }}
          restore-keys: nhl-cache-
      - run: npm run data:full
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
