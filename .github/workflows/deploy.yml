name: Build data and deploy

on:
  push: { branches: [main] }
  # GitHub throttles schedules heavily (in practice hours apart), so these are only a safety net.
  # The rerun job below is what keeps data fresh while games are being played.
  schedule:
    - cron: "*/20 * * * *"
    - cron: "17,47 4-7 * * *"   # extra mornings (UTC) when the last games end
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write, actions: write }  # actions: delete old caches
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    outputs: { live: "${{ steps.live.outputs.live }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Finished games never change, so cache the raw API responses between runs.
      # A cache entry can't be overwritten, so each run saves a new one and then deletes the older ones.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: nhl-cache-${{ github.run_id }}
          restore-keys: nhl-cache-
      - run: npm run data:full
      - id: live
        name: Any game in progress?
        run: echo "live=$(jq -s 'map(.[]) | any(.state == "LIVE" or .state == "CRIT")' public/data/season-*.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        with:
          path: .cache
          key: nhl-cache-${{ github.run_id }}
      - name: Delete older data caches
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh cache list --repo "${{ github.repository }}" --key nhl-cache- --limit 200 --json key --jq '.[].key' \
            | grep -vx "nhl-cache-${{ github.run_id }}" | xargs -r -n1 gh cache delete --repo "${{ github.repository }}" || true
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  # While a game is in progress, wait and start a new run so the result shows up soon after the final horn.
  # The chain stops on its own once no game is live. A newer run cancels this one (concurrency) and re-checks.
  rerun:
    needs: [build, deploy]
    if: needs.build.outputs.live == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: sleep 1200
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
