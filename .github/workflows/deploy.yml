name: Build data and deploy

on:
  push: { branches: [main] }
  schedule: [{ cron: "*/20 * * * *" }]   # refresh finished games every ~20 min
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write, actions: write }  # actions: delete old caches
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Finished games never change, so cache the raw API responses between runs.
      # A cache entry can't be overwritten, so each run saves a new one and then deletes the older ones.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: nhl-cache-${{ github.run_id }}
          restore-keys: nhl-cache-
      - run: npm run data:full
      - uses: actions/cache/save@v4
        with:
          path: .cache
          key: nhl-cache-${{ github.run_id }}
      - name: Delete older data caches
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh cache list --repo "${{ github.repository }}" --key nhl-cache- --limit 200 --json key --jq '.[].key' \
            | grep -vx "nhl-cache-${{ github.run_id }}" | xargs -r -n1 gh cache delete --repo "${{ github.repository }}" || true
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
